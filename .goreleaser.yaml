# goreleaser config for the bbs CLI.
#
# What ships: the Go `bbs` multicall binary, with the dashboard SPA embedded in
# it (see the before-hook below and internal/webui).
# The babysit skill pack and the hooks are NOT in these artifacts — they
# install via `git clone` + `go run ./cmd/bbs setup` (see README / docs/install.md).
#
# A new VERSION pushed to main (or a manual v* tag) starts the release pipeline.
# CI builds without publishing, stages docs/downloads and the formula, then
# publishes the complete draft.
#
# Verify locally without a tag:  goreleaser build --snapshot --clean
version: 2

project_name: bbs

before:
  hooks:
    - go mod tidy
    # Stages web/dist into internal/webui/dist so //go:embed picks it up. Needs
    # npm — a local `goreleaser build --snapshot` without Node will stop here.
    - ./scripts/build-webui.sh

builds:
  - id: bbs
    main: ./cmd/bbs
    binary: bbs
    env:
      - CGO_ENABLED=0
    # The tag drives `bbs --version`. Release archives ship without a checkout,
    # so the VERSION-file fallback in internal/cmd cannot resolve there and this
    # injection is the only source; a plain `go build` leaves it empty on
    # purpose and reads VERSION from the clone instead.
    ldflags:
      - -s -w -X github.com/2found/2build/internal/cmd.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: bbs
    ids:
      - bbs
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# NOTE: goreleaser's built-in formula generator (`brews:`) is deprecated in
# goreleaser v2 and its replacement (`homebrew_casks`) emits a Cask in Casks/
# installed via `brew install --cask` — not the Formula/bbs.rb + `brew install
# bbs` this repo requires (and casks are macOS-only, so they can't serve Linux).
# So the committed Formula/bbs.rb is the source of truth; the release workflow
# injects the real per-platform sha256 from `checksums.txt` into it on tag. See
# .github/workflows/release.yml (sync-formula step) and docs/install.md.

release:
  github:
    owner: 2found
    name: 2build
  # The workflow publishes the complete draft after distribution gates pass.
  draft: true
  prerelease: auto
