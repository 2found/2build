name: Test

# Runs the suites that actually exercise behavior. Build.yml only proves the
# CLI compiles on every target — it never ran a test, which is how two
# differential suites stayed red for weeks without anyone noticing: nothing on
# the push path executed them.
#
# No paths filter, deliberately. The shell suites cover git-flow moves, hooks,
# and workspace layout, so a change to the Go sources, hooks/, or tests/ can break them
# without touching a single .go file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/release-plan.test.mjs scripts/release-assets.test.mjs
      - run: python3 tests/test_codex_plugin.py

      # The suites invoke ./bbs — a build artifact that is gitignored.
      # Without this they all fail on a missing binary rather than on
      # anything real.
      - name: Build the multicall binary
        run: go build -o bbs ./cmd/bbs

      # Several suites commit inside throwaway repos. A runner has no global
      # identity, and git fails the commit rather than inventing one.
      #
      # It has to be env vars, not just `git config --global`: the suites point
      # HOME at a temp dir to isolate ~/.babysit, which also hides ~/.gitconfig,
      # so a global identity is invisible exactly where it is needed. macOS hid
      # this — git auto-detects an identity there, while a runner whose hostname
      # has no domain refuses to guess, and every merge bbs runs then fails and
      # gets reported as a merge conflict.
      - name: Configure git identity
        run: |
          git config --global user.email ci@babysit.test
          git config --global user.name  babysit-ci
          git config --global init.defaultBranch main
          {
            echo "GIT_AUTHOR_NAME=babysit-ci"
            echo "GIT_AUTHOR_EMAIL=ci@babysit.test"
            echo "GIT_COMMITTER_NAME=babysit-ci"
            echo "GIT_COMMITTER_EMAIL=ci@babysit.test"
          } >> "$GITHUB_ENV"
          # Hooks and a few skills shell out to a bare `bbs`.
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: go test
        run: go test ./...

      # The soot pack in packs/2build is generated from .claude/skills — a
      # skill edit that forgets to regenerate ships a stale pack, so the
      # script re-runs and the tree must diff clean. Pure stdlib Python.
      - name: 2build pack freshness
        run: python3 scripts/build-2build-pack.py --check-tree

      - name: Shell suites
        run: |
          pass=0; fail=0; failed=()
          for t in tests/test_*.sh; do
            if out="$(bash "$t" 2>&1)"; then
              pass=$((pass + 1)); printf 'PASS %s\n' "$t"
            else
              fail=$((fail + 1)); failed+=("$t")
              printf 'FAIL %s\n' "$t"
              printf '%s\n' "$out" | tail -30 | sed 's/^/     /'
            fi
          done
          printf '\n%d passed, %d failed\n' "$pass" "$fail"
          if [ "$fail" -gt 0 ]; then
            printf 'failed: %s\n' "${failed[*]}"
            exit 1
          fi
